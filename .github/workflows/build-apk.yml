name: Build Android APK

on:
  push:
    branches: [ main, master ]  # 推送代码到 main / master 分支自动触发构建
  workflow_dispatch:            # 允许在 GitHub 网页界面手动点击 "Run workflow"

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 配置 Java JDK 21 (符合最新 AGP 与 Gradle 规范)
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. 自动同意系统预装 Android SDK 许可
      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # 4. 环境准备：还原或自动生成 debug.keystore 与 .env 配置文件
      - name: Prepare Build Environment
        run: |
          # 1. 优先尝试从 debug.keystore.base64 解码还原
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # 2. 若文件不存在或为空，使用 keytool 自动生成标准 debug.keystore（双重兜底，绝不报错）
          if [ ! -s "debug.keystore" ]; then
            echo "debug.keystore not found, generating with keytool..."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. 校验 keystore 存在
          ls -la debug.keystore

          # 4. 确保环境变量配置文件存在
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

          # 5. 赋予 Gradle 包装器执行权限
          chmod +x ./gradlew

      # 5. 使用 Gradle 编译 Debug APK
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      # 6. 上传 APK 产物至 Actions Artifacts 供下载
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kid-english-island-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
